[workspace]
resolver = "3"
members = [
    "crates/*",
]

[workspace.package]
edition = "2024"
# The base MSRV; crates needing more set their own (`nur msrv` checks
# each crate on its own).
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/lsdocs/lsdocs-markdown"

[workspace.dependencies]
lsdocs-parser-myst = { path = "crates/parser-myst", version = "0.1.0" }
lsdocs-plugin-sdk = { git = "https://github.com/lsdocs/lsdocs-plugin-sdk", branch = "main", version = "0.1.0" }

markdown-it-rs = { version = "0.7.0", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
toml = "1.2.1"

[workspace.lints.rust]
# `deny` rather than `forbid` so the rpc crate can opt in locally with
# `#[allow(unsafe_code)]` for handle duplication (Phase 2).
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Library and binary code returns errors instead of panicking. Tests opt
# out with `#![allow(clippy::unwrap_used, ...)]` at the top of the module.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
